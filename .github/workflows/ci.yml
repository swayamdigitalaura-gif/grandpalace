name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        run: node build.js
        env:
          NITRO_PRESET: node-server
          INTERNAL_BACKEND_PORT: "4001"
          VITE_SITE_URL: https://thegrandpalace.com.au
          SITE_ORIGIN: https://thegrandpalace.com.au
          KEEP_FRONTEND_NODE_MODULES: "1"
